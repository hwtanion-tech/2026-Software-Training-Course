# 本机验收模式，数据持久化到backend/.local，不连接现有MySQL。
spring:
  datasource:
    url: jdbc:h2:file:./.local/campus-news-demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
  h2:
    console:
      enabled: false
campus:
  mode: demo
  demo-seed: true
