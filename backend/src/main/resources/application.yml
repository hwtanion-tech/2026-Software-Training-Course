server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: campus-news-backend

campus:
  database:
    # 默认关闭；服务启动不依赖本机数据库和密码。
    enabled: ${DB_ENABLED:false}
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/campus_news?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:campus_app}
    password: ${DB_PASSWORD:}
